name: Sync master and tags from upstream

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force-reset origin/master to upstream/master (use only when upstream rewrote history).'
        type: boolean
        required: false
        default: false

concurrency:
  group: sync-master
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master
        uses: actions/checkout@v6
        with:
          ref: master
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.email "actions@github.com"
          git config user.name "github-actions[bot]"

      - name: Add upstream remote
        run: git remote add upstream https://github.com/eclipse-mosquitto/mosquitto.git

      - name: Fetch upstream master and tags
        run: git fetch upstream master --tags --prune

      - name: Sync master to upstream/master
        env:
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          ORIGIN_SHA=$(git rev-parse origin/master)
          UPSTREAM_SHA=$(git rev-parse upstream/master)
          echo "origin/master   = $ORIGIN_SHA"
          echo "upstream/master = $UPSTREAM_SHA"

          if [ "$ORIGIN_SHA" = "$UPSTREAM_SHA" ]; then
            echo "Already in sync; nothing to push."
            exit 0
          fi

          if git merge-base --is-ancestor "$ORIGIN_SHA" "$UPSTREAM_SHA"; then
            git merge --ff-only upstream/master
            git push origin master
            exit 0
          fi

          echo "::group::Divergence detected"
          echo "Commits on origin/master not in upstream/master (will be DISCARDED if force=true):"
          git log --oneline "$UPSTREAM_SHA..$ORIGIN_SHA" || true
          echo "Commits on upstream/master not in origin/master:"
          git log --oneline "$ORIGIN_SHA..$UPSTREAM_SHA" || true
          echo "::endgroup::"

          if [ "$FORCE" = "true" ]; then
            echo "force=true: resetting origin/master to upstream/master ($UPSTREAM_SHA)"
            git reset --hard upstream/master
            git push --force-with-lease="master:$ORIGIN_SHA" origin master
          else
            echo "::error::origin/master has diverged from upstream/master. Re-run via Actions -> Run workflow -> force = true to overwrite. origin=$ORIGIN_SHA upstream=$UPSTREAM_SHA"
            exit 1
          fi

      - name: Push any new upstream tags and dispatch image builds
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mapfile -t tags < <(git for-each-ref --format='%(refname:short)' 'refs/tags/v*')
          for t in "${tags[@]}"; do
            if ! git ls-remote --tags --exit-code origin "refs/tags/$t" >/dev/null 2>&1; then
              echo "Pushing new tag: $t"
              git push origin "refs/tags/$t"
              echo "Dispatching build for $t"
              gh workflow run build-on-upstream-release.yml \
                --repo "${{ github.repository }}" \
                --ref "${{ github.ref_name }}" \
                -f tag="$t"
            fi
          done
